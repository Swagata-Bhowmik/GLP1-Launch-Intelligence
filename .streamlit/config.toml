# LaunchLens theme (Oct 2026 redesign; matches the landing site in site/). Glass, gradients and cursor: app/aurora.py
[theme]
base = "light"
primaryColor = "#14B8A6"              # teal: buttons, active widgets
backgroundColor = "#F4F8FF"           # sky-mist page background
secondaryBackgroundColor = "#FFFFFF"  # cards / sidebar widgets
textColor = "#1E2547"
font = "sans serif"

[client]
toolbarMode = "viewer"          # hide the Deploy button for visitors

[server]
enableStaticServing = true      # serves app/static/ (the landing site) at /app/static/
# Keep the default file watcher: Streamlit Community Cloud relies on it to load new code after a git push.
# (Locally, .claude/launch.json starts the server with --server.fileWatcherType none to silence torchvision noise.)
